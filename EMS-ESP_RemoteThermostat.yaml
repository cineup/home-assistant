blueprint:
  name: EMS-ESP – Remote Thermostat (nur Temperatur)
  description: >
    Überträgt die Raumtemperatur an ein EMS-ESP Thermostat mit Bereichsprüfung.
    Ist der Wert ungültig (außerhalb Bereich oder Sensor nicht verfügbar), wird
    KEIN -1 mehr gesendet – stattdessen wird der Regelmodus auf Wetterkompensation
    umgeschaltet, damit die Therme nicht in den Not-/Fehlerbetrieb wechselt oder
    unnötig heizt. Sobald der Wert wieder gültig ist, wird automatisch zurück auf
    den raumgeführten Modus geschaltet. Sendet zusätzlich regelmäßig (Heartbeat),
    damit die Therme keinen Sensor-Timeout meldet wenn der Wert stabil bleibt.
    Im Fehlerfall entsteht genau EINE Meldung, die beim Heartbeat aktualisiert und
    bei Entwarnung automatisch wieder entfernt wird – optional zusätzlich als Push.
  domain: automation
  input:
    temperature_sensor:
      name: Temperatur-Sensor
      selector:
        entity:
          domain: sensor

    target_temperature_number:
      name: Ziel-Temperatur (number entity)
      selector:
        entity:
          domain: number

    control_mode_select:
      name: Regelmodus (select entity)
      description: >
        Die select-Entity des Thermostats, z. B. select.thermostat_hc1_controlmode.
      selector:
        entity:
          domain: select

    control_mode_normal:
      name: Regelmodus – Normalbetrieb
      description: >
        Option, auf die geschaltet wird wenn der Temperaturwert gültig ist
        (raumgeführt). Muss exakt einer Option der Select-Entity entsprechen.
      default: "room"
      selector:
        text:

    control_mode_fallback:
      name: Regelmodus – Fallback (ungültiger Wert)
      description: >
        Option, auf die bei ungültigem/fehlendem Wert geschaltet wird
        (Wetterkompensation). Muss exakt einer Option der Select-Entity entsprechen.
      default: "weather compensated"
      selector:
        text:

    temperature_min:
      name: Temperatur Minimum
      default: 5.0
      selector:
        number:
          min: -50
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    temperature_max:
      name: Temperatur Maximum
      default: 30.0
      selector:
        number:
          min: -50
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    heartbeat_interval:
      name: Heartbeat-Intervall (Minuten)
      description: >
        Alle wie viele Minuten soll der Wert auch ohne Änderung gesendet werden?
        Verhindert den Sensor-Timeout-Fehler der Therme. Standard: 10 Minuten.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: "min"
          mode: slider

    notify_service:
      name: Push-Benachrichtigungsdienst (optional)
      description: >
        z. B. notify.mobile_app_dein_handy. Leer lassen = kein Push, es wird nur
        die Meldung in Home Assistant angezeigt. Ein Push kommt ausschließlich beim
        Wechsel in den Fehlerzustand und bei der Entwarnung – nicht beim Heartbeat.
      default: ""
      selector:
        text:

variables:
  temperature_sensor: !input temperature_sensor
  target_temperature_number: !input target_temperature_number
  control_mode_select: !input control_mode_select
  control_mode_normal: !input control_mode_normal
  control_mode_fallback: !input control_mode_fallback
  temperature_min: !input temperature_min
  temperature_max: !input temperature_max
  heartbeat_interval: !input heartbeat_interval
  notify_service: !input notify_service

trigger:
  - platform: state
    entity_id: !input temperature_sensor

  - platform: time_pattern
    minutes: "/1"

condition:
  - condition: template
    value_template: >
      {{ trigger.platform == 'state' or
         (now().minute % heartbeat_interval | int) == 0 }}

action:
  - variables:
      raw: "{{ states(temperature_sensor) }}"
      sensor_name: "{{ state_attr(temperature_sensor, 'friendly_name') or temperature_sensor }}"
      is_num: "{{ states(temperature_sensor) | is_number }}"
      val: "{{ states(temperature_sensor) | float(0) }}"
      in_range: >
        {{ states(temperature_sensor) | is_number
           and temperature_min <= states(temperature_sensor) | float(0) <= temperature_max }}
      # Feste ID: die Meldung wird bei jedem Lauf überschrieben statt neu angelegt.
      # Aus der Ziel-Entity abgeleitet, damit mehrere Heizkreise sich nicht überschreiben.
      notify_id: "ems_esp_remote_thermostat_{{ target_temperature_number | replace('.', '_') }}"
      # Fehlerbeginn = seit wann der Sensor diesen Zustand meldet.
      # Bewusst am Sensor festgemacht und nicht am Regelmodus: dessen Zustand wird
      # von dieser Automation selbst geschrieben und kann vom Thermostat wieder
      # zurueckgesetzt werden - last_changed waere dort kein verlaesslicher Marker.
      fault_since: >
        {{ as_local(states[temperature_sensor].last_changed).strftime('%d.%m. %H:%M')
           if states[temperature_sensor] is not none
           else now().strftime('%d.%m. %H:%M') }}
      push_enabled: "{{ notify_service | default('', true) | trim | length > 0 }}"

  - choose:
      # Gültiger Wert: Temperatur senden und (zurück) auf raumgeführten Modus
      - conditions:
          - condition: template
            value_template: "{{ in_range }}"
        sequence:
          - service: number.set_value
            data:
              entity_id: "{{ target_temperature_number }}"
              value: "{{ val }}"

          # Eventuell offene Störungsmeldung entfernen (No-op wenn keine existiert)
          - service: persistent_notification.dismiss
            data:
              notification_id: "{{ notify_id }}"

          - if:
              - condition: template
                value_template: "{{ states(control_mode_select) != control_mode_normal }}"
            then:
              - service: select.select_option
                target:
                  entity_id: "{{ control_mode_select }}"
                data:
                  option: "{{ control_mode_normal }}"

              # Entwarnung nur beim Wechsel zurück, nicht bei jedem Heartbeat
              - if:
                  - condition: template
                    value_template: "{{ push_enabled }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "{{ sensor_name }} wieder gültig"
                      message: >-
                        {{ val }} °C – Regelmodus zurück auf
                        „{{ control_mode_normal }}“.

    # Ungültiger Wert: KEIN -1 senden, sondern auf Wetterkompensation umschalten
    default:
      - variables:
          # Vor dem Umschalten auswerten: war der Fehler vorher noch nicht aktiv?
          was_ok: "{{ states(control_mode_select) != control_mode_fallback }}"
          # Sensorname steht im Titel, der Text nennt ihn deshalb nicht noch einmal
          fault_title: >-
            {{ sensor_name }}{{ ' nicht verfügbar' if not is_num
               else ' außerhalb Bereich' }}
          fault_value: >-
            {% if not is_num %}„{{ raw }}“{% else %}{{ val }} °C (zulässig
            {{ temperature_min }}–{{ temperature_max }} °C){% endif %}

      - if:
          - condition: template
            value_template: "{{ states(control_mode_select) != control_mode_fallback }}"
        then:
          # continue_on_error: ist das Thermostat selbst offline, schlaegt das
          # Umschalten fehl - die Meldung unten soll dann trotzdem geschrieben
          # werden, denn genau dann ist sie am wichtigsten.
          - service: select.select_option
            continue_on_error: true
            target:
              entity_id: "{{ control_mode_select }}"
            data:
              option: "{{ control_mode_fallback }}"

      # Gleiche notification_id => genau ein Eintrag, der aktualisiert wird
      - service: persistent_notification.create
        data:
          notification_id: "{{ notify_id }}"
          title: "{{ fault_title }}"
          # Regelmodus bewusst als Ist-Zustand: steht hier „unavailable“, ist auch
          # das Thermostat weg und die Umschaltung oben ist ins Leere gelaufen.
          message: |-
            - **Wert:** {{ fault_value }} seit {{ fault_since }}
            - **Regelmodus:** {{ states(control_mode_select) }}
            - **Geprüft:** {{ now().strftime('%H:%M') }} Uhr

      # Push nur beim Wechsel in den Fehlerzustand
      - if:
          - condition: template
            value_template: "{{ was_ok and push_enabled }}"
        then:
          - service: "{{ notify_service }}"
            data:
              title: "{{ fault_title }}"
              message: >-
                {{ fault_value }} seit {{ fault_since }} –
                Regelmodus: {{ states(control_mode_select) }}.

mode: single
max_exceeded: silent
