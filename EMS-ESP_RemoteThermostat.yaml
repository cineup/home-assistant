blueprint:
  name: EMS-ESP – Remote Thermostat (nur Temperatur)
  description: >
    Überträgt Temperatur an ein EMS-ESP Thermostat mit Bereichsprüfung und
    Fallback auf -1. Sendet zusätzlich regelmäßig (Heartbeat), damit die Therme
    keinen Sensor-Fehler meldet wenn der Wert stabil bleibt.
  domain: automation
  input:
    temperature_sensor:
      name: Temperatur-Sensor
      selector:
        entity:
          domain: sensor

    target_temperature_number:
      name: Ziel-Temperatur (number entity)
      selector:
        entity:
          domain: number

    temperature_min:
      name: Temperatur Minimum
      default: 5.0
      selector:
        number:
          min: -50
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    temperature_max:
      name: Temperatur Maximum
      default: 30.0
      selector:
        number:
          min: -50
          max: 50
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

    heartbeat_interval:
      name: Heartbeat-Intervall (Minuten)
      description: >
        Alle wie viele Minuten soll der Wert auch ohne Änderung gesendet werden?
        Verhindert den Sensor-Timeout-Fehler der Therme. Standard: 10 Minuten.
      default: 10
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: "min"
          mode: slider

variables:
  temperature_sensor: !input temperature_sensor
  target_temperature_number: !input target_temperature_number
  temperature_min: !input temperature_min
  temperature_max: !input temperature_max
  heartbeat_interval: !input heartbeat_interval

trigger:
  - platform: state
    entity_id: !input temperature_sensor

  - platform: time_pattern
    minutes: "/{{ heartbeat_interval }}"

condition: []

action:
  - variables:
      val: "{{ states(temperature_sensor) | float(-1) }}"

  - service: number.set_value
    data:
      entity_id: "{{ target_temperature_number }}"
      value: "{{ val if temperature_min <= val <= temperature_max else -1 }}"

  - if:
      - condition: template
        value_template: "{{ val < temperature_min or val > temperature_max }}"
    then:
      - service: persistent_notification.create
        data:
          title: "Temperatur außerhalb Bereich"
          message: "{{ temperature_sensor }} meldete {{ val }} °C – -1 wurde gesetzt."

mode: single
