blueprint:
  name: Fenster smart – Offen-Warnung & Kondensat-Frühwarnung
  description: >
    Zwei Wächter für ein Fenster in einer Automatisierung:


    **A · Fenster offen** – dauerhafte iPhone-Meldung, wenn zu lange offen oder
    gekippt. Die Wartezeit wird verlängert, solange wirklich gelüftet werden muss,
    und verkürzt, sobald der Raum auskühlt.


    **B · Kondensat-Frühwarnung** – meldet bei *geschlossenem* Fenster, dass jetzt
    gelüftet werden sollte: entweder weil die Wandoberfläche rechnerisch in den
    Schimmelbereich läuft, oder weil die Feuchte schnell ansteigt (Duschen, Kochen).


    Schimmelkriterium wahlweise über den **Taupunkt an der Wandoberfläche**
    (empfohlen) oder über die relative Raumluftfeuchte:

    * Taupunkt innen nach Magnus-Formel.

    * Wandtemperatur entweder gemessen oder geschätzt über den Temperaturfaktor
      fRsi: `T_Wand = T_aussen + fRsi * (T_innen - T_aussen)`.

    * Schimmelgefahr, sobald die Oberfläche den Taupunkt für 80 % Oberflächen-
      feuchte unterschreitet – also lange bevor sichtbares Tauwasser entsteht.


    Vor jeder Lüftungsaufforderung wird außerdem berechnet, auf welche Feuchte
    ein vollständiger Luftwechsel die Wand bringen würde. Nur wenn das unter der
    Schimmelgrenze landet, wird gelüftet – sonst lautet der Rat „Raum wärmer
    halten". Nach einem Lüften bekommt der Raum eine Ruhezeit, bevor erneut
    erinnert wird.


    Meldungen wiederholen sich in einstellbarem Takt bis das Fenster zu ist oder
    jemand bestätigt hat. Durch den gleichen `tag` ersetzt sich die Meldung selbst,
    es entsteht keine Flut. Beim Schließen wird sie automatisch entfernt.


    **Eine Automatisierung pro Fenster/Raum.**


    Hinweis: Die Tasten in der Meldung brauchen `notify.mobile_app_*` der
    Companion-App.
  domain: automation
  source_url: https://github.com/cineup/home-assistant/blob/main/fenster_offen_warnung.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    sec_fenster:
      name: 1 · Fenster & Raum
      icon: mdi:window-open-variant
      input:
        window_open:
          name: Sensor „Fenster auf"
          description: Binärsensor, der EIN ist, wenn das Fenster (ganz) geöffnet ist.
          selector:
            entity:
              filter:
                domain: binary_sensor

        window_tilt:
          name: Sensor „Fenster gekippt" (optional)
          description: >
            Separater Kipp-Kontakt. Leer lassen, wenn es keinen gibt.
            Für „gekippt" gilt eine eigene (meist längere) Grundzeit.
          default: []
          selector:
            entity:
              filter:
                domain: binary_sensor
              multiple: true

        room_name:
          name: Raumname
          description: Erscheint im Titel der Meldung.
          default: Raum
          selector:
            text:
              multiline: false

    sec_klima:
      name: 2 · Klima-Sensoren
      icon: mdi:thermometer-water
      input:
        temperature_sensor:
          name: Temperatur innen
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature

        humidity_sensor:
          name: Luftfeuchte innen
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity

        outdoor_temperature_sensor:
          name: Temperatur außen
          description: >
            Für Frostwarnung, den Vergleich der absoluten Feuchte und die
            Schätzung der Wandtemperatur. Ohne diesen Sensor arbeitet das
            Taupunkt-Kriterium nicht – dann „Relative Raumluftfeuchte" wählen.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
              multiple: true

        outdoor_humidity_sensor:
          name: Luftfeuchte außen (optional)
          description: Nur zusammen mit „Temperatur außen" sinnvoll.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: humidity
              multiple: true

        wall_temperature_sensor:
          name: Wandoberflächen-Temperatur (optional)
          description: >
            Falls vorhanden (z. B. DS18B20 an der kältesten Außenwandecke).
            Ersetzt die Schätzung über den Temperaturfaktor.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
              multiple: true

        weather_entity:
          name: Wetter-Entität (optional)
          description: Für „sofort melden bei Regen/Schnee".
          default: []
          selector:
            entity:
              filter:
                domain: weather
              multiple: true

    sec_melden:
      name: 3 · Meldung „Fenster offen"
      icon: mdi:cellphone-message
      input:
        notify_targets:
          name: Benachrichtigungsdienste
          description: >
            Ein Eintrag pro iPhone, z. B. `notify.mobile_app_iphone_anna`.
            Den exakten Namen findest du unter Entwicklerwerkzeuge → Aktionen,
            Suchfeld `notify.`.


            Kurzformen sind erlaubt: `mobile_app_iphone_anna` oder nur
            `iphone_anna` werden automatisch zu `notify.mobile_app_iphone_anna`
            ergänzt. Ein Eintrag mit Punkt wird unverändert übernommen, damit
            auch andere Dienste wie `notify.telegram_familie` möglich sind.


            Achtung: das ist der **Dienstname**, nicht der Gerätename aus der
            Companion-App – er beginnt immer mit `mobile_app_`.
          default: []
          selector:
            text:
              multiline: false
              multiple: true

        delay_open:
          name: Grundzeit „Fenster auf"
          description: Nach dieser Zeit wird gemeldet (sofern nicht verlängert).
          default: 10
          selector:
            number:
              min: 1
              max: 240
              step: 1
              unit_of_measurement: min
              mode: box

        delay_tilt:
          name: Grundzeit „Fenster gekippt"
          default: 45
          selector:
            number:
              min: 1
              max: 480
              step: 1
              unit_of_measurement: min
              mode: box

        repeat_interval:
          name: Wiederholung der Meldung
          description: Takt, in dem die Meldung erneut gesendet wird, bis Fenster zu oder bestätigt.
          default: 10
          selector:
            number:
              min: 1
              max: 120
              step: 1
              unit_of_measurement: min
              mode: box

        snooze_minutes:
          name: „Später erinnern"-Dauer
          description: Dauer der Schlummer-Taste in der Meldung. 0 = Taste ausblenden.
          default: 15
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider

        critical_after:
          name: Eskalation auf „critical" nach X Wiederholungen
          description: >
            Ab dieser Wiederholung wird die iOS-Meldung als *critical* gesendet und
            durchbricht Lautlos/Fokus. 0 = nie eskalieren.
          default: 3
          selector:
            number:
              min: 0
              max: 20
              step: 1
              mode: box

        max_rounds:
          name: Maximale Anzahl Meldungen
          description: 0 = unbegrenzt (bis Fenster zu oder bestätigt).
          default: 0
          selector:
            number:
              min: 0
              max: 100
              step: 1
              mode: box

        notify_url:
          name: Ziel beim Antippen (optional)
          description: "z. B. /lovelace/klima oder eine App-URL."
          default: ""
          selector:
            text:
              multiline: false

        close_confirmation:
          name: Bestätigung senden, wenn Fenster geschlossen wurde
          default: false
          selector:
            boolean:

    sec_schimmel:
      name: 4 · Schimmel-Kriterium
      icon: mdi:water-percent-alert
      input:
        mold_mode:
          name: Kriterium für „Lüften nötig"
          description: >
            **Taupunkt:** rechnet die Feuchte auf die kalte Wandoberfläche um –
            physikalisch korrekt und deutlich früher dran.
            **Relative Feuchte:** einfacher Schwellwert, falls kein Außensensor
            vorhanden ist.
          default: taupunkt
          selector:
            select:
              mode: list
              options:
                - label: Taupunkt an der Wandoberfläche (empfohlen)
                  value: taupunkt
                - label: Relative Raumluftfeuchte
                  value: relativ

        wall_factor:
          name: Temperaturfaktor fRsi der Außenwand
          description: >
            Nur wenn kein Wandsensor vorhanden. Wie warm bleibt die Wandinnenseite?
            Altbau ungedämmt ≈ 0.5–0.6 · saniert ≈ 0.7 · Neubau/KfW ≈ 0.85.
            Wärmebrücken (Raumecke, Fensterlaibung) liegen tiefer – im Zweifel
            0.05–0.1 niedriger ansetzen.
          default: 0.7
          selector:
            number:
              min: 0.4
              max: 0.95
              step: 0.01
              mode: slider

        mold_surface_rh:
          name: Kritische Oberflächenfeuchte
          description: Ab dieser Feuchte an der Wand kann Schimmel wachsen (Normwert 80 %).
          default: 80
          selector:
            number:
              min: 65
              max: 95
              step: 1
              unit_of_measurement: "%"
              mode: slider

        mold_margin:
          name: Sicherheitsabstand „ausgelüftet"
          description: Um so viel muss die Wand wieder über dem kritischen Taupunkt liegen.
          default: 1.0
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: "K"
              mode: box

        humidity_limit:
          name: Feuchte-Grenzwert (Modus „Relative Raumluftfeuchte")
          default: 60
          selector:
            number:
              min: 30
              max: 90
              step: 1
              unit_of_measurement: "%"
              mode: slider

        humidity_target:
          name: Ziel-Feuchte (Modus „Relative Raumluftfeuchte")
          default: 50
          selector:
            number:
              min: 25
              max: 80
              step: 1
              unit_of_measurement: "%"
              mode: slider

        ventilation_bonus:
          name: Zusätzliche Lüftungszeit
          description: Wird auf die Grundzeit addiert, solange Lüften nötig ist und laut Prognose auch hilft.
          default: 15
          selector:
            number:
              min: 0
              max: 180
              step: 5
              unit_of_measurement: min
              mode: box

        use_absolute_humidity:
          name: Absolute Feuchte innen/außen vergleichen
          description: >
            Benötigt Außen-Temperatur und Außen-Feuchte. Ist die absolute Feuchte
            draußen nicht niedriger als drinnen, bringt Lüften nichts.
          default: true
          selector:
            boolean:

        ah_margin:
          name: Mindest-Vorteil beim Lüften
          description: Um so viel muss die absolute Feuchte außen niedriger sein.
          default: 0.5
          selector:
            number:
              min: 0
              max: 5
              step: 0.1
              unit_of_measurement: "g/m³"
              mode: box

    sec_kalt:
      name: 5 · Auskühlschutz
      icon: mdi:snowflake-alert
      input:
        min_temperature:
          name: Minimale Raumtemperatur
          description: Wird sie unterschritten, kommt die Meldung sofort.
          default: 17
          selector:
            number:
              min: 5
              max: 25
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

        max_temp_drop:
          name: Maximaler Temperaturabfall
          description: Fällt die Temperatur seit dem Öffnen um so viel, kommt die Meldung sofort.
          default: 3
          selector:
            number:
              min: 0.5
              max: 15
              step: 0.5
              unit_of_measurement: "K"
              mode: box

        frost_limit:
          name: Frostgrenze außen
          description: "Außentemperatur darunter → sofortige Meldung. -50 = Prüfung aus."
          default: 0
          selector:
            number:
              min: -50
              max: 15
              step: 0.5
              unit_of_measurement: "°C"
              mode: box

    sec_kondensat:
      name: 6 · Kondensat-Frühwarnung (Fenster zu)
      icon: mdi:water-alert
      input:
        condensation_enable:
          name: Frühwarnung aktiv
          default: true
          selector:
            boolean:

        condensation_delay:
          name: Verzögerung
          description: So lange muss der kritische Zustand anhalten, bevor gemeldet wird.
          default: 20
          selector:
            number:
              min: 1
              max: 180
              step: 1
              unit_of_measurement: min
              mode: box

        humidity_rate_sensor:
          name: Feuchte-Anstiegssensor (optional)
          description: >
            Derivative-Helfer auf den Feuchtesensor, Einheit %/h
            (Einstellungen → Geräte & Dienste → Helfer → Ableitung).
            Erkennt Duschen/Kochen, bevor der Grenzwert überhaupt erreicht ist.
          default: []
          selector:
            entity:
              filter:
                domain: sensor
              multiple: true

        humidity_rate_limit:
          name: Grenzwert Feuchte-Anstieg
          default: 8
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: "%/h"
              mode: box

        vent_repeat:
          name: Wiederholung der Lüftungs-Erinnerung
          description: >
            Schimmel entsteht über Tage, nicht über Minuten – ein ruhiger Takt
            reicht. 0 = nur einmal melden.
          default: 120
          selector:
            number:
              min: 0
              max: 720
              step: 15
              unit_of_measurement: min
              mode: box

        vent_cooldown:
          name: Ruhezeit nach dem Lüften
          description: >
            Wurde das Fenster vor Kurzem geöffnet, bekommt das Lüften so lange
            Zeit zu wirken. Ist es danach immer noch kritisch, kommt der Hinweis
            „wieder feucht" – dann steckt eine Feuchtequelle im Raum.
            Gilt nicht für den schnellen Feuchteanstieg (Duschen). 0 = aus.
          default: 3
          selector:
            number:
              min: 0
              max: 12
              step: 0.5
              unit_of_measurement: h
              mode: box

        vent_time_start:
          name: Frühestens ab
          description: Außerhalb dieses Fensters wird nicht zum Lüften aufgefordert.
          default: "07:00:00"
          selector:
            time:

        vent_time_end:
          name: Spätestens bis
          default: "22:00:00"
          selector:
            time:

        vent_only_if_useful:
          name: Nur erinnern, wenn Lüften das Problem löst
          description: >
            Vor jeder Erinnerung wird berechnet, auf welche Feuchte das Lüften die
            Wand (bzw. den Raum) bringt. EIN = nur melden, wenn sie danach unter
            der Grenze liegt. AUS = sonst den Hinweis „Raum wärmer halten" senden.
            Ohne Außenfeuchte-Sensor rechnet die Prognose mit 100 % Außenfeuchte,
            dem ungünstigsten Fall.
          default: true
          selector:
            boolean:

    sec_extra:
      name: 7 · Zusätzliche Auslöser & Pause
      icon: mdi:tune
      input:
        presence_entities:
          name: Personen (optional)
          description: Für „sofort melden, wenn niemand mehr zu Hause ist".
          default: []
          selector:
            entity:
              filter:
                domain: person
              multiple: true

        absence_immediate:
          name: Sofort melden bei Abwesenheit aller
          default: true
          selector:
            boolean:

        rain_immediate:
          name: Sofort melden bei Regen/Schnee
          description: Benötigt eine Wetter-Entität (Abschnitt 2).
          default: true
          selector:
            boolean:

        pause_entity:
          name: Pausen-Schalter (optional)
          description: Ist dieser Helfer EIN, wird gar nicht gewarnt (z. B. „Putztag", „Sommerlüftung").
          default: []
          selector:
            entity:
              filter:
                domain: input_boolean
              multiple: true

        check_interval:
          name: Prüf-Intervall
          description: Wie oft die Bedingungen während der Wartezeit geprüft werden.
          default: 60
          selector:
            number:
              min: 15
              max: 300
              step: 15
              unit_of_measurement: s
              mode: box

mode: restart
max_exceeded: silent

# Nur diese Variablen sind in Triggern verfuegbar (eingeschraenkte Templates).
trigger_variables:
  tv_enable: !input condensation_enable
  tv_mode: !input mold_mode
  tv_win_open: !input window_open
  tv_win_tilt: !input window_tilt
  tv_temp: !input temperature_sensor
  tv_hum: !input humidity_sensor
  tv_out_temp: !input outdoor_temperature_sensor
  tv_wall: !input wall_temperature_sensor
  tv_factor: !input wall_factor
  tv_surface_rh: !input mold_surface_rh
  tv_hum_limit: !input humidity_limit

triggers:
  # --- Zweig A: Fenster geht auf ---------------------------------------------
  - trigger: state
    entity_id: !input window_open
    to: "on"
    id: auf
  - trigger: state
    entity_id: !input window_tilt
    to: "on"
    id: gekippt
  - trigger: homeassistant
    event: start
    id: neustart

  # --- Zweig B: Kondensat-Frueh
  #     Schimmelgefahr bei geschlossenem Fenster
  - trigger: template
    id: kondensat
    value_template: >
      {% if not tv_enable %}
        false
      {% else %}
        {% set tilt_on = tv_win_tilt | count > 0
             and expand(tv_win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
        {% set zu = not (is_state(tv_win_open, 'on') or tilt_on) %}
        {% set ti = states(tv_temp) | float(-999) %}
        {% set hi = states(tv_hum) | float(-1) %}
        {% set ot = states(tv_out_temp[0]) | float(-999) if tv_out_temp | count > 0 else -999 %}
        {% if tv_mode == 'taupunkt' %}
          {% set h80 = [hi / (tv_surface_rh / 100), 100] | min if hi > 0 else -1 %}
          {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
               if (ti > -900 and h80 > 0) else none %}
          {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
          {% set tw = states(tv_wall[0]) | float(-999) if tv_wall | count > 0
               else ((ot + tv_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
          {{ zu and tw > -900 and td80 > -900 and tw <= td80 }}
        {% else %}
          {{ zu and hi >= tv_hum_limit }}
        {% endif %}
      {% endif %}
    for:
      minutes: !input condensation_delay

  #     Schneller Feuchteanstieg (Duschen, Kochen, Waesche)
  - trigger: numeric_state
    id: anstieg
    entity_id: !input humidity_rate_sensor
    above: !input humidity_rate_limit

variables:
  win_open: !input window_open
  win_tilt: !input window_tilt
  temp_ent: !input temperature_sensor
  hum_ent: !input humidity_sensor
  out_temp_l: !input outdoor_temperature_sensor
  out_hum_l: !input outdoor_humidity_sensor
  wall_l: !input wall_temperature_sensor
  weather_l: !input weather_entity
  presence_l: !input presence_entities
  pause_l: !input pause_entity
  rate_l: !input humidity_rate_sensor
  room: !input room_name

  targets_raw: !input notify_targets
  targets: >
    {% set ns = namespace(l=[]) %}
    {% for t in targets_raw %}
      {% set s = t | trim | lower %}
      {% if s %}
        {% if '.' in s %}{% set n = s %}
        {% elif s.startswith('mobile_app_') %}{% set n = 'notify.' ~ s %}
        {% else %}{% set n = 'notify.mobile_app_' ~ s %}{% endif %}
        {% set ns.l = ns.l + [ n ] %}
      {% endif %}
    {% endfor %}
    {{ ns.l }}

  delay_open: !input delay_open
  delay_tilt: !input delay_tilt
  repeat_min: !input repeat_interval
  snooze_min: !input snooze_minutes
  critical_after: !input critical_after
  max_rounds: !input max_rounds
  notify_url: !input notify_url
  close_confirm: !input close_confirmation

  mold_mode: !input mold_mode
  wall_factor: !input wall_factor
  mold_rh: !input mold_surface_rh
  mold_margin: !input mold_margin
  hum_limit: !input humidity_limit
  hum_target: !input humidity_target
  vent_bonus: !input ventilation_bonus
  use_ah: !input use_absolute_humidity
  ah_margin: !input ah_margin

  temp_min: !input min_temperature
  drop_max: !input max_temp_drop
  frost_limit: !input frost_limit

  vent_repeat: !input vent_repeat
  vent_cooldown: !input vent_cooldown
  vent_start: !input vent_time_start
  vent_end: !input vent_time_end
  vent_useful_only: !input vent_only_if_useful
  rate_limit: !input humidity_rate_limit

  absence_immediate: !input absence_immediate
  rain_immediate: !input rain_immediate
  check_sec: !input check_interval

  slug: "{{ this.entity_id | replace('automation.', '') }}"
  alert_tag: "fenster_{{ slug }}"
  vent_tag: "lueften_{{ slug }}"
  ack_action: "FENSTER_OK_{{ slug | upper }}"
  snooze_action: "FENSTER_SNOOZE_{{ slug | upper }}"
  vent_ack_action: "LUEFTEN_OK_{{ slug | upper }}"

conditions:
  - condition: template
    value_template: "{{ targets | count > 0 }}"
  # Pausen-Schalter legt beide Zweige still
  - condition: template
    value_template: >
      {{ pause_l | count == 0
         or expand(pause_l) | selectattr('state','eq','on') | list | count == 0 }}
  # Zweig A nur bei offenem, Zweig B nur bei geschlossenem Fenster.
  # Dadurch koennen sich die beiden Zweige trotz mode:restart nie gegenseitig
  # abwuergen - die Bedingung wird geprueft, BEVOR ein laufender Durchlauf
  # neu gestartet wird.
  - condition: template
    value_template: >
      {% set tilt_on = win_tilt | count > 0
           and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
      {% set offen = is_state(win_open, 'on') or tilt_on %}
      {% set tid = (trigger.id | default('')) if trigger is defined else '' %}
      {{ offen if tid in ['auf', 'gekippt', 'neustart'] else not offen }}

actions:
  - choose:

      # ====================================================================
      # ZWEIG A - Fenster steht offen
      # ====================================================================
      - alias: Fenster offen
        conditions:
          - condition: template
            value_template: >
              {{ ((trigger.id | default('')) if trigger is defined else '')
                 in ['auf', 'gekippt', 'neustart'] }}
        sequence:
          # Eine evtl. offene Luefungsaufforderung ist jetzt erledigt
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ vent_tag }}"

          - variables:
              opened_at: "{{ now().timestamp() | int }}"
              temp_start: "{{ states(temp_ent) | float(-999) }}"
              lueftung_start: >
                {% set ti = states(temp_ent) | float(-999) %}
                {% set hi = states(hum_ent) | float(-1) %}
                {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                {% if mold_mode == 'taupunkt' %}
                  {% set h80 = [hi / (mold_rh / 100), 100] | min if hi > 0 else -1 %}
                  {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
                       if (ti > -900 and h80 > 0) else none %}
                  {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
                  {% set tw = states(wall_l[0]) | float(-999) if wall_l | count > 0
                       else ((ot + wall_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
                  {{ tw > -900 and td80 > -900 and tw <= td80 }}
                {% else %}
                  {{ hi >= 0 and hi >= hum_limit }}
                {% endif %}

          # ---------------------------------------- Phase 1: Warte-/Lueftungsfenster
          - repeat:
              sequence:
                - delay:
                    seconds: "{{ check_sec }}"
              until:
                - condition: template
                  value_template: >
                    {% set tilt_on = win_tilt | count > 0
                         and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
                    {% set offen = is_state(win_open, 'on') or tilt_on %}
                    {% set gekippt = tilt_on and not is_state(win_open, 'on') %}

                    {% set ti = states(temp_ent) | float(-999) %}
                    {% set hi = states(hum_ent) | float(-1) %}
                    {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                    {% set oh = states(out_hum_l[0]) | float(-1) if out_hum_l | count > 0 else -1 %}

                    {# absolute Feuchte innen/außen (Magnus) #}
                    {% set ahi = (216.7 * (hi / 100 * 6.112
                         * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)) / (273.15 + ti)))
                         if (ti > -900 and hi >= 0) else -1 %}
                    {% set aho = (216.7 * (oh / 100 * 6.112
                         * 2.718281828459045 ** (17.62 * ot / (243.12 + ot)) / (273.15 + ot)))
                         if (ot > -900 and oh >= 0) else -1 %}
                    {% set sinnvoll = (not use_ah) or ahi < 0 or aho < 0 or (aho <= ahi - ah_margin) %}

                    {# Taupunkt fuer kritische Oberflaechenfeuchte + Wandtemperatur #}
                    {% set h80 = [hi / (mold_rh / 100), 100] | min if hi > 0 else -1 %}
                    {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
                         if (ti > -900 and h80 > 0) else none %}
                    {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
                    {% set tw = states(wall_l[0]) | float(-999) if wall_l | count > 0
                         else ((ot + wall_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
                    {# Prognose: Feuchte nach vollstaendigem Luftwechsel. Beim Erwaermen der
                       Außenluft bleibt ihr Dampfdruck gleich, nur die Saettigung steigt. #}
                    {% set bez = 'Wandfeuchte' if mold_mode == 'taupunkt' else 'Raumfeuchte' %}
                    {% set grenze = mold_rh if mold_mode == 'taupunkt' else hum_limit %}
                    {% set ei = (hi / 100 * 6.112 * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)))
                         if (ti > -900 and hi >= 0) else -1 %}
                    {% set eo = (((oh / 100) if oh >= 0 else 1.0) * 6.112
                         * 2.718281828459045 ** (17.62 * ot / (243.12 + ot))) if ot > -900 else -1 %}
                    {% set tref = tw if mold_mode == 'taupunkt' else ti %}
                    {% set es = (6.112 * 2.718281828459045 ** (17.62 * tref / (243.12 + tref)))
                         if tref > -900 else -1 %}
                    {% set rf_jetzt = ((100 * ei / es) if (ei >= 0 and es > 0) else -1)
                         if mold_mode == 'taupunkt' else hi %}
                    {% set rf_nach = (100 * eo / es) if (eo >= 0 and es > 0) else -1 %}
                    {% set wirksam = sinnvoll and (rf_nach < 0 or rf_nach < grenze) %}

                    {% if mold_mode == 'taupunkt' %}
                      {% set gefahr = tw > -900 and td80 > -900 and tw <= td80 %}
                      {% set ziel = lueftung_start and tw > -900 and td80 > -900
                           and tw >= td80 + mold_margin %}
                    {% else %}
                      {% set gefahr = hi >= 0 and hi >= hum_limit %}
                      {% set ziel = lueftung_start and hi >= 0 and hi <= hum_target %}
                    {% endif %}
                    {% set lueften = gefahr and wirksam %}

                    {% set basis = (delay_tilt if gekippt else delay_open) * 60 %}
                    {% set wartezeit = basis + (vent_bonus * 60 if lueften else 0) %}

                    {% set kalt = ti > -900 and ti <= temp_min %}
                    {% set abfall = temp_start > -900 and ti > -900 and (temp_start - ti) >= drop_max %}
                    {% set frost = frost_limit > -50 and ot > -900 and ot <= frost_limit %}
                    {% set weg = absence_immediate and presence_l | count > 0
                         and expand(presence_l) | selectattr('state','eq','home') | list | count == 0 %}
                    {% set regen = rain_immediate and weather_l | count > 0
                         and states(weather_l[0]) in
                         ['rainy','pouring','hail','snowy','snowy-rainy','lightning-rainy','lightning'] %}

                    {% set elapsed = now().timestamp() - opened_at %}

                    {{ not offen or kalt or abfall or frost or weg or regen
                       or elapsed >= (basis if ziel else wartezeit) }}

          # Fenster ist inzwischen zu -> fertig, keine Meldung
          - condition: template
            value_template: >
              {{ is_state(win_open, 'on')
                 or (win_tilt | count > 0
                     and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0) }}

          # ------------------------------------------------------- Grund ermitteln
          - variables:
              grund: >
                {% set ti = states(temp_ent) | float(-999) %}
                {% set hi = states(hum_ent) | float(-1) %}
                {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                {% set oh = states(out_hum_l[0]) | float(-1) if out_hum_l | count > 0 else -1 %}
                {% set ahi = (216.7 * (hi / 100 * 6.112
                     * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)) / (273.15 + ti)))
                     if (ti > -900 and hi >= 0) else -1 %}
                {% set aho = (216.7 * (oh / 100 * 6.112
                     * 2.718281828459045 ** (17.62 * ot / (243.12 + ot)) / (273.15 + ot)))
                     if (ot > -900 and oh >= 0) else -1 %}
                {% set sinnvoll = (not use_ah) or ahi < 0 or aho < 0 or (aho <= ahi - ah_margin) %}
                {% set h80 = [hi / (mold_rh / 100), 100] | min if hi > 0 else -1 %}
                {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
                     if (ti > -900 and h80 > 0) else none %}
                {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
                {% set tw = states(wall_l[0]) | float(-999) if wall_l | count > 0
                     else ((ot + wall_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
                {# Prognose: Feuchte nach vollstaendigem Luftwechsel. Beim Erwaermen der
                   Außenluft bleibt ihr Dampfdruck gleich, nur die Saettigung steigt. #}
                {% set bez = 'Wandfeuchte' if mold_mode == 'taupunkt' else 'Raumfeuchte' %}
                {% set grenze = mold_rh if mold_mode == 'taupunkt' else hum_limit %}
                {% set ei = (hi / 100 * 6.112 * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)))
                     if (ti > -900 and hi >= 0) else -1 %}
                {% set eo = (((oh / 100) if oh >= 0 else 1.0) * 6.112
                     * 2.718281828459045 ** (17.62 * ot / (243.12 + ot))) if ot > -900 else -1 %}
                {% set tref = tw if mold_mode == 'taupunkt' else ti %}
                {% set es = (6.112 * 2.718281828459045 ** (17.62 * tref / (243.12 + tref)))
                     if tref > -900 else -1 %}
                {% set rf_jetzt = ((100 * ei / es) if (ei >= 0 and es > 0) else -1)
                     if mold_mode == 'taupunkt' else hi %}
                {% set rf_nach = (100 * eo / es) if (eo >= 0 and es > 0) else -1 %}
                {% set wirksam = sinnvoll and (rf_nach < 0 or rf_nach < grenze) %}
                {% if mold_mode == 'taupunkt' %}
                  {% set gefahr = tw > -900 and td80 > -900 and tw <= td80 %}
                  {% set ziel = lueftung_start and tw > -900 and td80 > -900
                       and tw >= td80 + mold_margin %}
                {% else %}
                  {% set gefahr = hi >= 0 and hi >= hum_limit %}
                  {% set ziel = lueftung_start and hi >= 0 and hi <= hum_target %}
                {% endif %}
                {% set kalt = ti > -900 and ti <= temp_min %}
                {% set abfall = temp_start > -900 and ti > -900 and (temp_start - ti) >= drop_max %}
                {% set frost = frost_limit > -50 and ot > -900 and ot <= frost_limit %}
                {% set weg = absence_immediate and presence_l | count > 0
                     and expand(presence_l) | selectattr('state','eq','home') | list | count == 0 %}
                {% set regen = rain_immediate and weather_l | count > 0
                     and states(weather_l[0]) in
                     ['rainy','pouring','hail','snowy','snowy-rainy','lightning-rainy','lightning'] %}
                {% if weg %}Niemand mehr zu Hause – bitte schließen!
                {% elif kalt %}Raum kühlt aus ({{ ti | round(1) }} °C) – bitte schließen!
                {% elif abfall %}Temperatur um {{ (temp_start - ti) | round(1) }} K gefallen – bitte schließen!
                {% elif frost %}Frost draußen ({{ ot | round(1) }} °C) – bitte schließen!
                {% elif regen %}Es regnet/schneit – bitte schließen!
                {% elif ziel %}Ausgelüftet – {{ bez }} {{ rf_jetzt | round(0) | int }} %. Fenster kann zu.
                {% elif gefahr and not sinnvoll %}Draußen ist die Luft feuchter – Lüften bringt nichts.
                {% elif gefahr and not wirksam %}Lüften allein reicht hier nicht ({{ bez }} bliebe bei {{ rf_nach | round(0) | int }} %) – Fenster kann zu.
                {% elif gefahr %}{{ bez }} noch {{ rf_jetzt | round(0) | int }} %, aber schon lange offen.
                {% else %}Fenster steht schon lange offen.
                {% endif %}

          # ------------------------------------------ Phase 2: Dauer-Erinnerung
          - repeat:
              sequence:
                - variables:
                    runde: "{{ repeat.index }}"
                    kritisch: "{{ critical_after > 0 and repeat.index >= critical_after }}"
                    push_data: >
                      {% set acts = [ {'action': ack_action, 'title': 'Erledigt / ignorieren'} ] %}
                      {% if snooze_min > 0 %}
                        {% set acts = acts + [ {'action': snooze_action,
                             'title': 'Später (' ~ snooze_min ~ ' min)'} ] %}
                      {% endif %}
                      {% set d = {
                           'tag': alert_tag,
                           'group': 'fenster',
                           'apns_headers': {'apns-collapse-id': alert_tag},
                           'actions': acts,
                           'push': {
                             'interruption-level': ('critical' if kritisch else 'time-sensitive'),
                             'sound': ({'name': 'default', 'critical': 1, 'volume': 1.0}
                                       if kritisch else 'default'),
                             'thread-id': alert_tag,
                             'badge': 1
                           }
                         } %}
                      {% if notify_url %}{% set d = dict(d, url=notify_url) %}{% endif %}
                      {{ d }}

                - repeat:
                    for_each: "{{ targets }}"
                    sequence:
                      - action: "{{ repeat.item }}"
                        continue_on_error: true
                        data:
                          title: >
                            {% set tilt_on = win_tilt | count > 0
                                 and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
                            {{ '🪟 ' ~ room ~ ': Fenster '
                               ~ ('gekippt' if tilt_on and not is_state(win_open,'on') else 'offen') }}
                          message: >
                            {% set ti = states(temp_ent) | float(-999) %}
                            {% set hi = states(hum_ent) | float(-1) %}
                            {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                            {% set mins = ((now().timestamp() - opened_at) / 60) | round(0) | int %}
                            {{ grund.split() | join(' ') ~ '\n' ~ 'Seit ' ~ mins ~ ' min · 🌡 '
                               ~ (ti | round(1)) ~ ' °C · 💧 ' ~ (hi | round(0) | int) ~ ' %'
                               ~ ((' · außen ' ~ (ot | round(1)) ~ ' °C') if ot > -900 else '')
                               ~ ((' · ' ~ runde ~ '. Erinnerung') if runde > 1 else '') }}
                          data: "{{ push_data }}"

                - wait_for_trigger:
                    - trigger: state
                      entity_id: !input window_open
                      to: "off"
                    - trigger: state
                      entity_id: !input window_tilt
                      to: "off"
                    - trigger: event
                      event_type: mobile_app_notification_action
                  timeout: "{{ (repeat_min * 60) | int }}"
                  continue_on_timeout: true

                # „Später erinnern" gedrueckt -> schlummern und danach erneut melden
                - if:
                    - condition: template
                      value_template: >
                        {{ snooze_min > 0
                           and wait.trigger is defined and wait.trigger is not none
                           and wait.trigger.event is defined
                           and (wait.trigger.event.data.action | default('')) == snooze_action }}
                  then:
                    - repeat:
                        for_each: "{{ targets }}"
                        sequence:
                          - action: "{{ repeat.item }}"
                            continue_on_error: true
                            data:
                              message: clear_notification
                              data:
                                tag: "{{ alert_tag }}"
                    - delay:
                        minutes: "{{ snooze_min }}"
              until:
                - condition: template
                  value_template: >
                    {% set tilt_on = win_tilt | count > 0
                         and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
                    {% set offen = is_state(win_open, 'on') or tilt_on %}
                    {% set act = (wait.trigger.event.data.action | default(''))
                         if (wait.trigger is defined and wait.trigger is not none
                             and wait.trigger.event is defined) else '' %}
                    {{ not offen or act == ack_action
                       or (max_rounds > 0 and repeat.index >= max_rounds) }}

          # ---------------------------------------------------------- Aufraeumen
          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ alert_tag }}"

          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {% set tilt_on = win_tilt | count > 0
                           and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
                      {{ close_confirm and not (is_state(win_open, 'on') or tilt_on) }}
                sequence:
                  - repeat:
                      for_each: "{{ targets }}"
                      sequence:
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            title: "✅ {{ room }}"
                            message: >
                              Fenster geschlossen · 🌡 {{ states(temp_ent) | float(0) | round(1) }} °C
                              · 💧 {{ states(hum_ent) | float(0) | round(0) | int }} %
                            data:
                              tag: "{{ alert_tag }}_ok"
                              group: fenster
                              push:
                                interruption-level: passive

      # ====================================================================
      # ZWEIG B - Fenster zu, aber es sollte gelueftet werden
      # ====================================================================
      - alias: Kondensat-Fruehwarnung
        conditions:
          - condition: template
            value_template: >
              {{ ((trigger.id | default('')) if trigger is defined else '')
                 in ['kondensat', 'anstieg'] }}
        sequence:
          # Kuerzlich gelueftet? Dann bekommt das Lueften erst Zeit zu wirken.
          # Gilt nicht fuer den schnellen Feuchteanstieg - frisch geduscht ist
          # ein neues Ereignis.
          - variables:
              zu_seit: >
                {% set lc = expand([win_open] + win_tilt)
                     | map(attribute='last_changed') | max %}
                {{ (now() - lc).total_seconds() | int }}
              gelueftet_um: >
                {% set lc = expand([win_open] + win_tilt)
                     | map(attribute='last_changed') | max %}
                {{ as_local(lc).strftime('%H:%M') }}
              trotz_lueften: >
                {{ ((trigger.id | default('')) if trigger is defined else '') == 'kondensat'
                   and vent_cooldown > 0 and zu_seit < vent_cooldown * 3600 }}
          - if:
              - condition: template
                value_template: "{{ trotz_lueften }}"
            then:
              - delay:
                  seconds: "{{ (vent_cooldown * 3600 - zu_seit) | int }}"

          - repeat:
              sequence:
                - variables:
                    vrunde: "{{ repeat.index }}"
                    lage: >
                      {% set ti = states(temp_ent) | float(-999) %}
                      {% set hi = states(hum_ent) | float(-1) %}
                      {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                      {% set oh = states(out_hum_l[0]) | float(-1) if out_hum_l | count > 0 else -1 %}
                      {% set ahi = (216.7 * (hi / 100 * 6.112
                           * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)) / (273.15 + ti)))
                           if (ti > -900 and hi >= 0) else -1 %}
                      {% set aho = (216.7 * (oh / 100 * 6.112
                           * 2.718281828459045 ** (17.62 * ot / (243.12 + ot)) / (273.15 + ot)))
                           if (ot > -900 and oh >= 0) else -1 %}
                      {% set sinnvoll = (not use_ah) or ahi < 0 or aho < 0 or (aho <= ahi - ah_margin) %}
                      {% set h80 = [hi / (mold_rh / 100), 100] | min if hi > 0 else -1 %}
                      {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
                           if (ti > -900 and h80 > 0) else none %}
                      {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
                      {% set tw = states(wall_l[0]) | float(-999) if wall_l | count > 0
                           else ((ot + wall_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
                      {% set gefahr = (tw > -900 and td80 > -900 and tw <= td80)
                           if mold_mode == 'taupunkt' else (hi >= 0 and hi >= hum_limit) %}
                      {# Prognose: Feuchte nach vollstaendigem Luftwechsel. Beim Erwaermen der
                         Außenluft bleibt ihr Dampfdruck gleich, nur die Saettigung steigt. #}
                      {% set bez = 'Wandfeuchte' if mold_mode == 'taupunkt' else 'Raumfeuchte' %}
                      {% set grenze = mold_rh if mold_mode == 'taupunkt' else hum_limit %}
                      {% set ei = (hi / 100 * 6.112 * 2.718281828459045 ** (17.62 * ti / (243.12 + ti)))
                           if (ti > -900 and hi >= 0) else -1 %}
                      {% set eo = (((oh / 100) if oh >= 0 else 1.0) * 6.112
                           * 2.718281828459045 ** (17.62 * ot / (243.12 + ot))) if ot > -900 else -1 %}
                      {% set tref = tw if mold_mode == 'taupunkt' else ti %}
                      {% set es = (6.112 * 2.718281828459045 ** (17.62 * tref / (243.12 + tref)))
                           if tref > -900 else -1 %}
                      {% set rf_jetzt = ((100 * ei / es) if (ei >= 0 and es > 0) else -1)
                           if mold_mode == 'taupunkt' else hi %}
                      {% set rf_nach = (100 * eo / es) if (eo >= 0 and es > 0) else -1 %}
                      {% set wirksam = sinnvoll and (rf_nach < 0 or rf_nach < grenze) %}
                      {% set rate = states(rate_l[0]) | float(0) if rate_l | count > 0 else 0 %}
                      {% set anstieg = rate_l | count > 0 and rate >= rate_limit %}
                      {{ {'ti': ti, 'hi': hi, 'ot': ot, 'rate': rate,
                          'rf_jetzt': rf_jetzt, 'rf_nach': rf_nach, 'grenze': grenze,
                          'oh_bekannt': oh >= 0, 'gefahr': gefahr, 'anstieg': anstieg,
                          'sinnvoll': sinnvoll, 'wirksam': wirksam} }}

                # Nur im Zeitfenster, nur solange die Lage besteht, und - je nach
                # Einstellung - nur wenn Lueften das Problem laut Prognose auch loest
                - if:
                    - condition: template
                      value_template: >
                        {% set jetzt = now().strftime('%H:%M:%S') %}
                        {% set imfenster = (vent_start <= jetzt <= vent_end)
                             if vent_start <= vent_end
                             else (jetzt >= vent_start or jetzt <= vent_end) %}
                        {{ imfenster and (lage.gefahr or lage.anstieg)
                           and (lage.wirksam or not vent_useful_only)
                           and (vent_repeat > 0 or vrunde == 1) }}
                  then:
                    - variables:
                        v_titel: >
                          {% if not lage.sinnvoll %}🔥 {{ room }}: heizen statt lüften
                          {%- elif not lage.wirksam %}🔥 {{ room }}: Lüften reicht nicht
                          {%- elif trotz_lueften %}💧 {{ room }}: wieder feucht
                          {%- elif lage.anstieg and not lage.gefahr %}💧 {{ room }}: jetzt lüften
                          {%- else %}💧 {{ room }}: bitte lüften{% endif %}
                        v_text: >
                          {%- set bez = 'Wandfeuchte' if mold_mode == 'taupunkt' else 'Raumfeuchte' -%}
                          {%- set ab = 'Schimmel ab' if mold_mode == 'taupunkt' else 'Grenze' -%}
                          {%- set jetzt = bez ~ ' ' ~ (lage.rf_jetzt | round(0) | int) ~ ' % ('
                               ~ ab ~ ' ' ~ (lage.grenze | int) ~ ' %)' -%}
                          {%- set nach = lage.rf_nach | round(0) | int -%}
                          {%- if not lage.sinnvoll -%}
                            {%- set z1 = 'Draußen ist die Luft feuchter – Lüften bringt nichts. '
                                 ~ jetzt ~ ', Raum lieber wärmer halten.' -%}
                          {%- elif not lage.wirksam -%}
                            {%- set z1 = jetzt ~ '. Lüften senkt sie '
                                 ~ ('nur auf ≈ ' if lage.oh_bekannt else 'bei feuchter Außenluft nur auf ')
                                 ~ nach ~ ' % – Raum wärmer halten hilft mehr.' -%}
                          {%- elif trotz_lueften -%}
                            {%- set z1 = 'Seit dem Lüften um ' ~ gelueftet_um ~ ' wieder ' ~ jetzt
                                 ~ '. Feuchtequelle im Raum (nasse Handtücher, Wäsche)?' -%}
                          {%- elif lage.anstieg and not lage.gefahr -%}
                            {%- set z1 = 'Feuchte steigt schnell (' ~ (lage.rate | round(1))
                                 ~ ' %/h) – jetzt kurz stoßlüften, bevor es kritisch wird.' -%}
                          {%- elif lage.rf_nach < 0 -%}
                            {%- set z1 = jetzt ~ '. Bitte lüften.' -%}
                          {%- else -%}
                            {%- set z1 = jetzt ~ '. Lüften senkt sie auf '
                                 ~ ('≈ ' if lage.oh_bekannt else 'höchstens ') ~ nach ~ ' %.' -%}
                          {%- endif -%}
                          {%- set z2 = '🌡 ' ~ (lage.ti | round(1)) ~ ' °C · 💧 '
                               ~ (lage.hi | round(0) | int) ~ ' %'
                               ~ ((' · außen ' ~ (lage.ot | round(1)) ~ ' °C') if lage.ot > -900 else '')
                               ~ ((' · ' ~ vrunde ~ '. Erinnerung') if vrunde > 1 else '') -%}
                          {{ z1 ~ '\n' ~ z2 }}
                    - repeat:
                        for_each: "{{ targets }}"
                        sequence:
                          - action: "{{ repeat.item }}"
                            continue_on_error: true
                            data:
                              title: "{{ v_titel }}"
                              message: "{{ v_text }}"
                              data: >
                                {% set d = {
                                     'tag': vent_tag,
                                     'group': 'fenster',
                                     'apns_headers': {'apns-collapse-id': vent_tag},
                                     'actions': [ {'action': vent_ack_action, 'title': 'Erledigt'} ],
                                     'push': {
                                       'interruption-level': 'active',
                                       'sound': 'default',
                                       'thread-id': vent_tag
                                     }
                                   } %}
                                {% if notify_url %}{% set d = dict(d, url=notify_url) %}{% endif %}
                                {{ d }}

                - wait_for_trigger:
                    - trigger: state
                      entity_id: !input window_open
                      to: "on"
                    - trigger: state
                      entity_id: !input window_tilt
                      to: "on"
                    - trigger: event
                      event_type: mobile_app_notification_action
                  timeout: "{{ ((vent_repeat if vent_repeat > 0 else 15) * 60) | int }}"
                  continue_on_timeout: true
              until:
                - condition: template
                  value_template: >
                    {% set tilt_on = win_tilt | count > 0
                         and expand(win_tilt) | selectattr('state','eq','on') | list | count > 0 %}
                    {% set offen = is_state(win_open, 'on') or tilt_on %}
                    {% set act = (wait.trigger.event.data.action | default(''))
                         if (wait.trigger is defined and wait.trigger is not none
                             and wait.trigger.event is defined) else '' %}
                    {% set ti = states(temp_ent) | float(-999) %}
                    {% set hi = states(hum_ent) | float(-1) %}
                    {% set ot = states(out_temp_l[0]) | float(-999) if out_temp_l | count > 0 else -999 %}
                    {% set h80 = [hi / (mold_rh / 100), 100] | min if hi > 0 else -1 %}
                    {% set a80 = (log(h80 / 100) + 17.62 * ti / (243.12 + ti))
                         if (ti > -900 and h80 > 0) else none %}
                    {% set td80 = (243.12 * a80 / (17.62 - a80)) if a80 is not none else -999 %}
                    {% set tw = states(wall_l[0]) | float(-999) if wall_l | count > 0
                         else ((ot + wall_factor * (ti - ot)) if (ti > -900 and ot > -900) else -999) %}
                    {% set gefahr = (tw > -900 and td80 > -900 and tw <= td80 + mold_margin)
                         if mold_mode == 'taupunkt' else (hi >= 0 and hi > hum_target) %}
                    {% set rate = states(rate_l[0]) | float(0) if rate_l | count > 0 else 0 %}
                    {% set anstieg = rate_l | count > 0 and rate >= rate_limit %}
                    {{ offen or act == vent_ack_action or not (gefahr or anstieg) }}

          - repeat:
              for_each: "{{ targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  continue_on_error: true
                  data:
                    message: clear_notification
                    data:
                      tag: "{{ vent_tag }}"
